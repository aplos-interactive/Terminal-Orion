<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Terminal — intern@orion</title>
  <link rel="stylesheet" href="orion.css">
  <script src="orion.js" defer></script>
</head>
<body>
  <main id="win" aria-label="Unix terminal emulator">
    <header id="bar">
      <span class="window-menu" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="title">intern@orion: ~</span>
      <span class="window-actions" aria-hidden="true">
        <span class="win-btn minimize"></span>
        <span class="win-btn maximize"></span>
        <span class="win-btn close"></span>
      </span>
    </header>
    <nav id="menubar" aria-label="Terminal menus"><span>File</span><span>Edit</span><span>Tabs</span><span>Help</span></nav>
    <section id="screen" aria-label="Terminal output">
      <div id="out" aria-live="polite"></div>
      <div id="row"><span id="pl"></span><input id="in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal input"></div>
    </section>
    <span id="cwdv" hidden aria-hidden="true"></span>
    <section id="ed" aria-label="Text editor">
      <header><span id="edname"></span><span class="editor-actions"><button id="edsave">Save</button><button id="edquit">Close</button><span class="dim editor-shortcuts">Ctrl+S save · Esc close</span></span></header>
      <textarea id="edta" spellcheck="false" aria-label="Editor"></textarea>
    </section>
  </main>
</body>
</html>
